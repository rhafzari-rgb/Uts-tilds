<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Teknologi Literasi Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: exam-hall CBT — question sheet on the left, invigilator rail (timer + answer grid) on the right; stacks on phones. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --ink: #162033;
  --muted: #586379;
  --line: #DCE1EA;
  --accent: #1F4FD1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EDFC;
  --flag: #A86A0C;
  --flag-soft: #FBF0DC;
  --ok: #17784A;
  --ok-soft: #E3F4EA;
  --bad: #B42318;
  --bad-soft: #FDE9E7;
  --shadow: 0 1px 2px rgba(22,32,51,.06), 0 4px 16px rgba(22,32,51,.06);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131C; --surface: #161D2A; --ink: #E6EAF2; --muted: #9AA5B8; --line: #283246;
    --accent: #85A6FF; --accent-ink: #0B1020; --accent-soft: #1B2747;
    --flag: #E4AC52; --flag-soft: #2F2515; --ok: #55C890; --ok-soft: #14291F; --bad: #F48A7F; --bad-soft: #321A18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131C; --surface: #161D2A; --ink: #E6EAF2; --muted: #9AA5B8; --line: #283246;
  --accent: #85A6FF; --accent-ink: #0B1020; --accent-soft: #1B2747;
  --flag: #E4AC52; --flag-soft: #2F2515; --ok: #55C890; --ok-soft: #14291F; --bad: #F48A7F; --bad-soft: #321A18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hidden { display: none !important; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
.mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 13px; flex: none; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--flag-soft); color: var(--flag); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.toptimer { font-family: var(--font-mono); font-weight: 700; font-size: 15px; padding: 5px 12px; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.flagbtn[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.block { width: 100%; }
.btn.sm { padding: 6px 11px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 24px; }

/* start screen */
.start { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .9fr); gap: 28px; align-items: start; }
.intro { display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); max-width: 62ch; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.fact b { font-family: var(--font-mono); font-size: 24px; font-weight: 700; }
.fact span { font-size: 13.5px; color: var(--muted); }
.rules { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; counter-reset: r; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; max-width: 66ch; }
.rules li::before { content: counter(r); font-family: var(--font-mono); font-weight: 700; font-size: 13px; width: 26px; height: 26px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-top: 1px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14.5px; }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 11px 13px; width: 100%; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field .hint { font-size: 13px; color: var(--muted); }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; font-weight: 500; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 14.5px; }
.note.warn { background: var(--flag-soft); color: var(--ink); }
.formfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* exam */
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.qcard { padding: 28px 30px; display: flex; flex-direction: column; gap: 22px; }
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qno { font-family: var(--font-mono); font-weight: 700; font-size: 15px; background: var(--ink); color: var(--surface); padding: 4px 10px; border-radius: 6px; }
.qtype { color: var(--muted); font-size: 14px; font-weight: 600; }
.stem { font-size: 18px; line-height: 1.6; max-width: 70ch; user-select: none; -webkit-user-select: none; }
.opts { display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .letter { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.opt .otext { padding-top: 3px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.essay { min-height: 260px; resize: vertical; line-height: 1.6; font-size: 16px; }
.essaymeta { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
.qfoot { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.qfoot .mid { display: flex; gap: 10px; flex-wrap: wrap; }
.tabwarn { background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: 12px 16px; font-weight: 600; font-size: 14.5px; margin-bottom: 14px; }

.side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 76px; }
.timercard { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.timercard .lbl { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.timer { font-family: var(--font-mono); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
.timercard.warn .timer { color: var(--flag); } .timercard.warn .tbar i { background: var(--flag); }
.timercard.crit .timer { color: var(--bad); } .timercard.crit .tbar i { background: var(--bad); }
.who { font-size: 14px; color: var(--muted); padding: 0 2px; overflow-wrap: anywhere; }
.who b { color: var(--ink); }
.navcard { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.navhead { display: flex; justify-content: space-between; font-weight: 700; font-size: 14.5px; }
.navlabel { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.gbtn { aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--surface); border-radius: 7px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); position: relative; padding: 0; }
.gbtn.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gbtn.flag { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.gbtn.done.flag { background: var(--flag); border-color: var(--flag); color: #fff; }
.gbtn.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1.5px solid var(--line); }
.legend .l-done { background: var(--accent); border-color: var(--accent); }
.legend .l-flag { background: var(--flag-soft); border-color: var(--flag); }

/* result */
.result { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.result .hero { display: flex; gap: 18px; align-items: flex-start; }
.okicon { width: 52px; height: 52px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; flex: none; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0; }
.dl dt { color: var(--muted); font-size: 14.5px; }
.dl dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.codebox { width: 100%; min-height: 110px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; word-break: break-all; }
details summary { cursor: pointer; font-weight: 600; }

/* lecturer */
.dhead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 4px; }
.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 14.5px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-family: var(--font-mono); font-size: 28px; font-weight: 700; line-height: 1.1; }
.tile span { font-size: 13.5px; color: var(--muted); }
.importbar { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .num { width: 78px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td .btn { white-space: nowrap; }
th { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; white-space: nowrap; background: var(--surface); }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--bg); }
.empty { padding: 34px; text-align: center; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.keyq { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.keyq ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; list-style: upper-alpha; }
.keyq li.right { color: var(--ok); font-weight: 700; }
.keyq .bahas { font-size: 14.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.rub { width: 100%; }
.rub td:last-child, .rub th:last-child { text-align: right; width: 90px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal .box { background: var(--surface); border-radius: 12px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal .box.wide { width: min(980px, 100%); }
.modal .acts { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.grader { display: flex; flex-direction: column; gap: 22px; }
.gitem { border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.answerbox { background: var(--bg); border-radius: 8px; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; font-size: 15px; }
.rubin { width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); text-align: right; font-family: var(--font-mono); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 14.5px; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (max-width: 960px) {
  .start, .exam, .importbar { grid-template-columns: 1fr; }
  .side { position: static; }
  .timercard { display: none; }
  .toptimer { font-size: 17px; padding: 6px 14px; }
  .grid { grid-template-columns: repeat(8, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qcard { padding: 20px 18px; }
  .stem { font-size: 17px; }
  .grid { grid-template-columns: repeat(6, 1fr); }
  h1 { font-size: 25px; }
  .brand span { display: none; }
  .wrap { padding: 20px 16px 56px; }
  .pad { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .topbar, .actions, .tabs, .importbar, .toolbar { display: none !important; }
  body { background: #fff; }
}
</style>

<script>
/* Shared helpers: used by build.js (Node) and inlined into the page. */
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0);
  };
}
function utf8Encode(s) { return new TextEncoder().encode(s); }
function utf8Decode(b) { return new TextDecoder().decode(b); }
function b64FromBytes(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function bytesFromB64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function xorStream(bytes, pass, salt) {
  const rnd = mulberry32(fnv1a(salt + "|" + pass) ^ fnv1a(pass + "#" + salt.length));
  const out = new Uint8Array(bytes.length);
  let word = 0;
  for (let i = 0; i < bytes.length; i++) {
    if (i % 4 === 0) word = rnd();
    out[i] = bytes[i] ^ ((word >>> ((i % 4) * 8)) & 0xff);
  }
  return out;
}
const MAGIC = "TLDv1:";
function sealText(text, pass, salt) {
  return b64FromBytes(xorStream(utf8Encode(MAGIC + text), pass, salt));
}
function openText(blob, pass, salt) {
  try {
    const s = utf8Decode(xorStream(bytesFromB64(blob), pass, salt));
    return s.startsWith(MAGIC) ? s.slice(MAGIC.length) : null;
  } catch (e) { return null; }
}
function seededShuffle(arr, seed) {
  const rnd = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd() % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};

function fmtDate(ms) {
  const d = new Date(ms);
  try { return d.toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return d.toISOString(); }
}
function fmtNum(x, dp = 1) { return (Math.round(x * Math.pow(10, dp)) / Math.pow(10, dp)).toFixed(dp).replace(".", ","); }
function words(t) { const m = (t || "").trim().match(/\S+/g); return m ? m.length : 0; }

function toast(msg, ms = 3200) {
  const root = $("#toastRoot");
  root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { root.innerHTML = ""; }, ms);
}

function openModal({ title, body, actions = [], wide = false, dismiss = true }) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="box ${wide ? "wide" : ""}"><h2 id="mTitle">${esc(title)}</h2><div class="mbody">${body}</div>
    <div class="acts">${actions.map((a, i) => `<button class="btn ${a.cls || ""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div></div></div>`;
  const m = root.firstElementChild;
  $$(".acts button", m).forEach(b => b.addEventListener("click", () => { const a = actions[+b.dataset.i]; if (!a.keep) closeModal(); a.onClick && a.onClick(); }));
  if (dismiss) {
    m.addEventListener("click", e => { if (e.target === m) closeModal(); });
    m._esc = e => { if (e.key === "Escape") closeModal(); };
    document.addEventListener("keydown", m._esc);
  }
  const f = $(".acts .primary", m) || $(".acts button", m);
  f && f.focus();
  return m;
}
function closeModal() {
  const m = $("#modalRoot .modal");
  if (m && m._esc) document.removeEventListener("keydown", m._esc);
  $("#modalRoot").innerHTML = "";
}

async function getDownloads() {
  try {
    if (window.claude && typeof window.claude.use === "function") return await window.claude.use("downloads");
  } catch (e) {}
  return null;
}
async function saveFile(filename, text, mime) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data: text }); toast("Berkas " + filename + " disimpan."); return true; }
    catch (err) {
      if (err && err.code === "declined") { toast("Penyimpanan dibatalkan."); return false; }
      if (err && err.code === "rate_limited") { toast("Tunggu sebentar, lalu coba lagi."); return false; }
    }
  }
  try {
    const blob = new Blob([text], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Mengunduh " + filename + ". Kalau tidak ada berkas yang terunduh, pakai tombol Salin.");
    return true;
  } catch (e) {
    toast("Unduhan tidak tersedia di tampilan ini. Pakai tombol Salin.");
    return false;
  }
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast("Tersalin ke papan klip."); return true; }
  catch (e) {
    if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); }
    toast("Teks sudah dipilih. Tekan Ctrl+C (atau tahan lalu Salin) untuk menyalin.");
    return false;
  }
}
function setStatus(html) { $("#topStatus").innerHTML = html || ""; }

/* ---------- jawaban: rekaman & verifikasi ---------- */
function checksum(rec) {
  const core = JSON.stringify({ paket: rec.paket, nim: rec.nim, nama: rec.nama, kelas: rec.kelas, mulai: rec.mulai, selesai: rec.selesai, pg: rec.pg, esai: rec.esai, pindahTab: rec.pindahTab });
  return fnv1a("cek|" + SALT + "|" + core).toString(16).padStart(8, "0") + fnv1a(core + "|" + SALT).toString(16).padStart(8, "0");
}
function encodeRecord(rec) { return "TLD1." + b64FromBytes(utf8Encode(JSON.stringify(rec))); }
function decodeRecordText(t) {
  t = (t || "").trim();
  if (!t) return null;
  try {
    if (t.startsWith("TLD1.")) return JSON.parse(utf8Decode(bytesFromB64(t.slice(5).replace(/\s+/g, ""))));
    if (t.startsWith("{")) return JSON.parse(t);
  } catch (e) { return null; }
  return null;
}

/* ---------- routing ---------- */
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function route() {
  stopTimer(); closeModal(); window.scrollTo(0, 0);
  if (location.hash === "#dosen") return renderDosenLogin();
  setStatus("");
  const sess = LS.get(KEY_SESSION);
  if (sess && !sess.finished) {
    const txt = openText(QBLOB, sess.token, SALT);
    if (txt) { Q = JSON.parse(txt); S = sess; if (Date.now() >= S.end) return finish(true); return renderStart(sess); }
    LS.del(KEY_SESSION);
  }
  renderStart(null);
}
window.addEventListener("hashchange", route);

      actions: [{ label: "Batal" }, { label: "Kumpulkan & mulai baru", cls: "danger solid", onClick: () => { finish(false, true); renderStart(null); } }]
    });

    <div id="startErr" class="err hidden" role="alert"></div>

  </form>`;
  $("#startForm").addEventListener("submit", e => { e.preventDefault(); startExam(); });
}

function startExam() {
  const nama = $("#fNama").value.trim().replace(/\s+/g, " ");
  const nim = $("#fNim").value.trim().replace(/\s+/g, "");
  const kelas = $("#fKelas").value.trim().replace(/\s+/g, " ");
  const token = $("#fToken").value.trim().toUpperCase();
  const err = $("#startErr");
  const fail = m => { err.textContent = m; err.classList.remove("hidden"); };
  if (nama.length < 3) return fail("Tuliskan nama lengkap Anda.");
  if (!/^[0-9A-Za-z.\-]{5,20}$/.test(nim)) return fail("NIM harus 5–20 karakter dan hanya berisi angka atau huruf.");
  if (!kelas) return fail("Tuliskan kelas Anda.");
  if (!token) return fail("Masukkan token ujian dari pengawas.");
  const done = LS.get(KEY_DONE(nim));
  if (done && done.record) { renderResult(done.record, { already: true }); return; }
  const txt = openText(QBLOB, token, SALT);
  if (!txt) return fail("Token tidak sesuai. Periksa kembali huruf dan angkanya dengan pengawas.");
  Q = JSON.parse(txt);
  const seed = fnv1a(nim + "|" + SALT);
  const optPerm = {};
  Q.pg.forEach(q => { optPerm[q.id] = seededShuffle(q.opsi.map((_, i) => i), (seed ^ fnv1a(q.id)) >>> 0); });
  const now = Date.now();
  S = {
    v: 1, paket: CONFIG.paket, nama, nim, kelas, token,
    start: now, end: now + CONFIG.durasiMenit * 60000,
    order: seededShuffle(Q.pg.map(q => q.id), seed), optPerm,
    esaiOrder: Q.esai.map(e => e.id),
    ans: {}, esai: {}, ragu: {}, cur: 0, tab: 0, paste: 0, finished: false
  };
  saveSession();
  tryFullscreen();
  renderExam();
}
function saveSession() { if (S && !S.finished) LS.set(KEY_SESSION, S); }
function tryFullscreen() { try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); p && p.catch && p.catch(() => {}); } catch (e) {} }
function exitFullscreen() { try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {} }

/* ---------- ujian ---------- */
function items() { return [...S.order.map(id => ({ t: "pg", id })), ...S.esaiOrder.map(id => ({ t: "esai", id }))]; }
function qById(t, id) { return (t === "pg" ? Q.pg : Q.esai).find(q => q.id === id); }
function isAnswered(it) { return it.t === "pg" ? (S.ans[it.id] !== undefined && S.ans[it.id] !== null) : (S.esai[it.id] || "").trim().length > 0; }
function label(i) { return i < S.order.length ? String(i + 1) : "E" + (i - S.order.length + 1); }
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = n => String(n).padStart(2, "0");
  return (h ? h + ":" + p(m) : p(m)) + ":" + p(x);
}

function renderExam() {
  const its = items();
  window.scrollTo(0, 0);
  app.innerHTML = `
  <div class="exam">

        <div class="navlabel">Pilihan ganda</div>
        <div class="grid" id="gridPG">${S.order.map((_, i) => `<button class="gbtn" data-i="${i}" aria-label="Soal ${i + 1}">${i + 1}</button>`).join("")}</div>
        <div class="navlabel">Esai</div>
        <div class="grid" id="gridE">${S.esaiOrder.map((_, j) => { const i = S.order.length + j; return `<button class="gbtn" data-i="${i}" aria-label="Esai ${j + 1}">E${j + 1}</button>`; }).join("")}</div>
        <div class="legend"><span><i class="l-done"></i>Terjawab</span><span><i class="l-flag"></i>Ragu-ragu</span><span><i></i>Belum</span></div>

    </aside>
  </div>`;
  $$(".gbtn").forEach(b => b.addEventListener("click", () => goTo(+b.dataset.i)));
  $("#btnFinish").onclick = confirmFinish;
  if (S.cur >= its.length) S.cur = 0;
  renderQ(); updateNav(); tick(); showTabWarn();
  stopTimer(); timerId = setInterval(tick, 1000);
}

function renderQ() {
  const its = items(); const it = its[S.cur]; const q = qById(it.t, it.id);
  const isPG = it.t === "pg";
  const flagged = !!S.ragu[it.id];
  let body;
  if (isPG) {
    const perm = S.optPerm[q.id];
    body = `<p class="stem">${esc(q.soal)}</p>
    <div class="opts" role="radiogroup" aria-label="Pilihan jawaban">
      ${perm.map((orig, k) => `<label class="opt" for="opt${k}"><input type="radio" name="opt" id="opt${k}" value="${orig}" ${S.ans[q.id] === orig ? "checked" : ""}><span class="letter">${LETTERS[k]}</span><span class="otext">${esc(q.opsi[orig])}</span></label>`).join("")}
    </div>`;
  } else {
    const val = S.esai[q.id] || "";
    body = `<p class="stem">${esc(q.soal)}</p>
    <div class="field"><label for="essay">Jawaban Anda</label>
      <textarea id="essay" class="essay" spellcheck="true">${esc(val)}</textarea>
      <div class="essaymeta"><span id="wc">${words(val)} kata</span><span>Skor maksimal ${q.maks}${CONFIG.blokTempel ? " · Menempel teks tidak diizinkan" : ""}</span></div>
    </div>`;
  }
  $("#qcard").innerHTML = `
    <header class="qhead"><span class="qno">${isPG ? "Soal " + label(S.cur) : "Esai " + label(S.cur).slice(1)}</span><span class="qtype">${isPG ? "Pilihan ganda · pilih satu jawaban" : "Esai · uraikan jawaban Anda"}</span></header>
    ${body}
    <footer class="qfoot">
      <button class="btn" id="bPrev" ${S.cur === 0 ? "disabled" : ""}>‹ Sebelumnya</button>
      <div class="mid">
        <button class="btn flagbtn" id="bFlag" aria-pressed="${flagged}">${flagged ? "Ragu-ragu ✓" : "Tandai ragu-ragu"}</button>
        ${isPG ? `<button class="btn ghost" id="bClear">Kosongkan</button>` : ""}
      </div>
      ${S.cur === its.length - 1 ? `<button class="btn primary" id="bNext">Selesai ›</button>` : `<button class="btn primary" id="bNext">Berikutnya ›</button>`}
    </footer>`;
  const card = $("#qcard");
  ["copy", "cut", "contextmenu"].forEach(ev => $$(".stem, .opts", card).forEach(el => el.addEventListener(ev, e => e.preventDefault())));
  if (isPG) {
    $$('input[name="opt"]', card).forEach(r => r.addEventListener("change", () => { S.ans[q.id] = Number(r.value); saveSession(); updateNav(); }));
    $("#bClear").onclick = () => { delete S.ans[q.id]; saveSession(); renderQ(); updateNav(); };
  } else {
    const ta = $("#essay");
    let was = isAnswered(it);
    ta.addEventListener("input", () => {
      S.esai[q.id] = ta.value;
      $("#wc").textContent = words(ta.value) + " kata";
      const now = isAnswered(it); if (now !== was) { was = now; updateNav(); }
      clearTimeout(essayTimer); essayTimer = setTimeout(saveSession, 400);
    });
    ta.addEventListener("blur", saveSession);
    if (CONFIG.blokTempel) {
      ta.addEventListener("paste", e => { e.preventDefault(); S.paste++; saveSession(); toast("Menempel teks tidak diizinkan. Ketik jawaban Anda sendiri."); });
      ta.addEventListener("drop", e => { e.preventDefault(); });
    }
  }
  $("#bPrev").onclick = () => goTo(S.cur - 1);
  $("#bNext").onclick = () => S.cur === its.length - 1 ? confirmFinish() : goTo(S.cur + 1);
  $("#bFlag").onclick = () => { if (S.ragu[it.id]) delete S.ragu[it.id]; else S.ragu[it.id] = true; saveSession(); renderQ(); updateNav(); };
}
function goTo(i) {
  const n = items().length;
  if (i < 0 || i >= n) return;
  saveSession(); S.cur = i; saveSession(); renderQ(); updateNav();
  if (window.innerWidth < 960) $("#qcard").scrollIntoView({ block: "start", behavior: "smooth" });
}
function updateNav() {
  const its = items(); let done = 0;
  its.forEach((it, i) => {
    const b = $(`.gbtn[data-i="${i}"]`); if (!b) return;
    const a = isAnswered(it); if (a) done++;
    b.classList.toggle("done", a); b.classList.toggle("flag", !!S.ragu[it.id]); b.classList.toggle("cur", i === S.cur);
    if (i === S.cur) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
  $("#prog").textContent = done + "/" + its.length;
}
function tick() {
  if (!S || S.finished) return stopTimer();
  const left = S.end - Date.now();
  const total = CONFIG.durasiMenit * 60000;
  const t = $("#timer"); if (!t) return;
  t.textContent = fmtClock(left);
  $("#tbar").style.width = Math.max(0, Math.min(100, left / total * 100)) + "%";
  const card = $("#timerCard");
  card.classList.toggle("warn", left <= 10 * 60000 && left > 2 * 60000);
  card.classList.toggle("crit", left <= 2 * 60000);
  setStatus(`<span class="chip toptimer ${left <= 2 * 60000 ? "bad" : left <= 10 * 60000 ? "warn" : ""}" aria-label="Sisa waktu">${fmtClock(left)}</span>`);
  if (left <= 0) finish(true);
}
function showTabWarn() {
  const w = $("#tabWarn"); if (!w) return;
  if (S.tab > 0) { w.textContent = `Anda tercatat meninggalkan halaman ujian ${S.tab} kali. Catatan ini dilaporkan kepada dosen.`; w.classList.remove("hidden"); }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && S && !S.finished && $("#qcard")) { S.tab++; saveSession(); }
  else if (!document.hidden) showTabWarn();
});
window.addEventListener("beforeunload", e => { if (S && !S.finished && $("#qcard")) { saveSession(); e.preventDefault(); e.returnValue = ""; } });

function confirmFinish() {
  saveSession();
  const its = items();
  const empty = [], flagged = [];
  its.forEach((it, i) => { if (!isAnswered(it)) empty.push(label(i)); if (S.ragu[it.id]) flagged.push(label(i)); });
  const body = `<div class="stack" style="gap:12px">
    <p>Setelah dikumpulkan, jawaban tidak dapat diubah lagi.</p>
    ${empty.length ? `<div class="note warn"><b>${empty.length} soal belum dijawab:</b> ${esc(empty.join(", "))}</div>` : `<div class="note">Semua soal sudah dijawab.</div>`}
    ${flagged.length ? `<div class="note warn"><b>${flagged.length} soal ditandai ragu-ragu:</b> ${esc(flagged.join(", "))}</div>` : ""}
    <p class="small muted">Sisa waktu: <span class="mono">${fmtClock(S.end - Date.now())}</span></p></div>`;
  openModal({ title: "Kumpulkan jawaban sekarang?", body, actions: [{ label: "Periksa lagi" }, { label: "Ya, kumpulkan", cls: "primary", onClick: () => finish(false) }] });
}

function buildRecord(auto) {
  const now = Math.min(Date.now(), S.end);
  const pg = {}; Q.pg.forEach(q => { pg[q.id] = (S.ans[q.id] === undefined ? null : S.ans[q.id]); });
  const esai = {}; Q.esai.forEach(e => { esai[e.id] = S.esai[e.id] || ""; });
  const rec = {
    app: "UjianTLD", v: 1, paket: CONFIG.paket, mk: CONFIG.mk,
    nama: S.nama, nim: S.nim, kelas: S.kelas,
    mulai: new Date(S.start).toISOString(), selesai: new Date(now).toISOString(),
    durasiDetik: Math.round((now - S.start) / 1000), otomatis: !!auto,
    pindahTab: S.tab, tempelDiblok: S.paste,
    urutanPG: S.order, pg, esai, ragu: Object.keys(S.ragu)
  };
  rec.cek = checksum(rec);
  return rec;
}
function finish(auto, silent) {
  stopTimer();
  if (!S || S.finished) return;
  const rec = buildRecord(auto);
  LS.set(KEY_DONE(S.nim), { record: rec });
  S.finished = true; LS.del(KEY_SESSION);
  closeModal(); exitFullscreen();
  if (!silent) renderResult(rec, { auto });
  S = null;
}

/* ---------- hasil ---------- */

function renderDosenLogin() {
  setStatus(`<span class="chip">Mode dosen</span>`);
  const saved = SS.get("tld_pin");
  if (saved && unlock(saved)) return renderDosen("rekap");
  app.innerHTML = `<div style="max-width:440px;margin:40px auto">
    <form class="card pad form" id="pinForm" novalidate>
      <h2>Masuk sebagai dosen</h2>
      <p class="muted small">Panel dosen berisi kunci jawaban, rubrik esai, dan rekap nilai.</p>
      <div class="field"><label for="fPin">PIN dosen</label><input id="fPin" type="password" class="mono" autocomplete="off" required></div>
      <div id="pinErr" class="err hidden" role="alert"></div>
      <button class="btn primary block" type="submit">Masuk</button>
      <a href="#" class="small" style="color:var(--muted)">‹ Kembali ke halaman ujian</a>
    </form></div>`;
  $("#fPin").focus();
  $("#pinForm").addEventListener("submit", e => {
    e.preventDefault();
    const pin = $("#fPin").value.trim();
    if (unlock(pin)) { SS.set("tld_pin", pin); renderDosen("rekap"); }
    else { const er = $("#pinErr"); er.textContent = "PIN tidak sesuai."; er.classList.remove("hidden"); }
  });
}
function unlock(pin) {
  const t = openText(KBLOB, pin, SALT); if (!t) return false;
  K = JSON.parse(t);
  Q = JSON.parse(openText(QBLOB, K.token.toUpperCase(), SALT));
  R = LS.get(KEY_REKAP) || { records: {}, scores: {}, wPG: CONFIG.bobotPG, wE: CONFIG.bobotEsai };
  return true;
}
function saveRekap() { if (!LS.set(KEY_REKAP, R)) toast("Peramban menolak penyimpanan lokal. Ekspor CSV sebelum menutup halaman."); }

function renderDosen(tab) {
  setStatus(`<span class="chip">Mode dosen</span> <button class="btn sm ghost" id="bOut">Keluar</button>`);
  $("#bOut").onclick = () => { SS.del("tld_pin"); K = null; R = null; location.hash = ""; };
  const tabs = [["rekap", "Rekap nilai"], ["kunci", "Kunci & rubrik"], ["info", "Info paket"]];
  app.innerHTML = `<div class="dhead"><h1 style="font-size:26px">Panel dosen</h1><div class="spacer" style="flex:1"></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${k === tab}">${l}</button>`).join("")}</div></div>
    <div id="dbody"></div>`;
  $$(".tabs button").forEach(b => b.onclick = () => renderDosen(b.dataset.t));
  if (tab === "rekap") renderRekap(); else if (tab === "kunci") renderKunci(); else renderInfo();
}

function pgScore(rec) {
  let b = 0; Q.pg.forEach(q => { if (rec.pg && rec.pg[q.id] === K.pg[q.id].kunci) b++; });
  return { benar: b, nilai: b / Q.pg.length * 100 };
}
function esaiScore(nim) {
  const rec = R.records[nim]; const sc = R.scores[nim] || {};
  let tot = 0, max = 0, graded = 0;
  Q.esai.forEach(e => {
    max += e.maks;
    const arr = sc[e.id];
    const has = arr && arr.some(v => v !== null && v !== "" && !isNaN(v));
    if (has) { graded++; tot += arr.reduce((a, v) => a + (Number(v) || 0), 0); }
    else if (!((rec.esai || {})[e.id] || "").trim()) { graded++; }
  });
  return { tot, max, graded, complete: graded === Q.esai.length, nilai: max ? tot / max * 100 : 0 };
}
function finalScore(nim) {
  const pg = pgScore(R.records[nim]); const es = esaiScore(nim);
  const w = (Number(R.wPG) || 0) + (Number(R.wE) || 0) || 1;
  return { pg, es, akhir: ((Number(R.wPG) || 0) * pg.nilai + (Number(R.wE) || 0) * es.nilai) / w };
}

function importRecords(list) {
  let ok = 0, dup = 0, bad = 0, other = 0;
  list.forEach(rec => {
    if (!rec || rec.app !== "UjianTLD" || !rec.nim || !rec.pg) { bad++; return; }
    if (rec.paket !== CONFIG.paket) { other++; return; }
    rec._valid = checksum(rec) === rec.cek;
    const prev = R.records[rec.nim];
    if (prev) { dup++; if (new Date(rec.selesai) < new Date(prev.selesai)) return; }
    R.records[rec.nim] = rec; ok++;
  });
  saveRekap();
  const parts = [`${ok} lembar jawaban dimuat`];
  if (dup) parts.push(`${dup} NIM ganda (dipakai yang terbaru)`);
  if (other) parts.push(`${other} dari paket lain dilewati`);
  if (bad) parts.push(`${bad} tidak terbaca`);
  toast(parts.join(" · "), 5000);
  renderRekap();
}
async function readFiles(files) {
  const recs = [];
  for (const f of files) {
    try { recs.push(decodeRecordText(await f.text())); } catch (e) { recs.push(null); }
  }
  importRecords(recs);
}

function renderRekap() {
  const nims = Object.keys(R.records).sort();
  const rows = nims.map(n => ({ n, rec: R.records[n], ...finalScore(n) }));
  const complete = rows.filter(r => r.es.complete);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const avgFinal = avg(complete.map(r => r.akhir));
  const avgPG = avg(rows.map(r => r.pg.nilai));
  const pending = rows.length - complete.length;
  $("#dbody").innerHTML = `<div class="stack">
    <div class="tiles">
      <div class="card tile"><b>${rows.length}</b><span>lembar jawaban</span></div>
      <div class="card tile"><b>${avgPG === null ? "–" : fmtNum(avgPG)}</b><span>rata-rata nilai PG</span></div>
      <div class="card tile"><b>${avgFinal === null ? "–" : fmtNum(avgFinal)}</b><span>rata-rata nilai akhir${complete.length < rows.length && complete.length ? " (" + complete.length + " lengkap)" : ""}</span></div>
      <div class="card tile"><b style="color:${pending ? "var(--flag)" : "inherit"}">${pending}</b><span>esai belum dinilai</span></div>
    </div>
    <div class="importbar">
      <div class="drop" id="drop">
        <h3>Muat lembar jawaban</h3>
        <p class="small muted">Seret berkas <span class="mono">.json</span> dari mahasiswa ke sini, atau pilih beberapa berkas sekaligus.</p>
        <label class="btn primary sm" for="fFiles">Pilih berkas</label>
        <input type="file" id="fFiles" accept=".json,.txt,application/json,text/plain" multiple class="hidden">
      </div>
      <div class="card pad stack" style="gap:10px">
        <h3><label for="fPaste">Tempel kode jawaban</label></h3>
        <textarea id="fPaste" class="codebox" style="min-height:76px" placeholder="TLD1.eyJhcHAiOi... (boleh beberapa kode sekaligus, pisahkan dengan baris baru)"></textarea>
        <div><button class="btn sm" id="bPaste">Muat dari kode</button></div>
      </div>
    </div>
    <div class="card pad stack" style="gap:14px">
      <div class="toolbar">
        <h2 style="margin-right:auto">Daftar nilai</h2>
        <label class="small" for="wPG">Bobot PG (%)</label><input type="number" id="wPG" class="num mono" min="0" max="100" value="${esc(R.wPG)}">
        <label class="small" for="wE">Esai (%)</label><input type="number" id="wE" class="num mono" min="0" max="100" value="${esc(R.wE)}">
        <button class="btn sm primary" id="bCsv" ${rows.length ? "" : "disabled"}>Ekspor CSV</button>
        <button class="btn sm" id="bTsv" ${rows.length ? "" : "disabled"}>Salin tabel</button>
        <button class="btn sm danger" id="bClearAll" ${rows.length ? "" : "disabled"}>Hapus semua</button>
      </div>
      <div class="tablewrap">${rows.length ? `<table>
        <thead><tr><th class="n">No</th><th>NIM</th><th>Nama</th><th>Kelas</th><th class="n">PG benar</th><th class="n">Nilai PG</th><th class="n">Nilai esai</th><th class="n">Nilai akhir</th><th>Catatan</th><th></th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr>
          <td class="n">${i + 1}</td><td class="mono">${esc(r.n)}</td><td>${esc(r.rec.nama)}</td><td>${esc(r.rec.kelas)}</td>
          <td class="n">${r.pg.benar}/${Q.pg.length}</td><td class="n">${fmtNum(r.pg.nilai)}</td>
          <td class="n">${r.es.complete ? fmtNum(r.es.nilai) : `<span class="chip warn">${r.es.graded}/${Q.esai.length}</span>`}</td>
          <td class="n"><b>${r.es.complete ? fmtNum(r.akhir) : "–"}</b></td>
          <td>${[r.rec._valid ? "" : `<span class="chip bad" title="Isi berkas tidak cocok dengan kode verifikasi">Berkas diubah</span>`, r.rec.pindahTab ? `<span class="chip warn">Pindah tab ${r.rec.pindahTab}×</span>` : "", r.rec.tempelDiblok ? `<span class="chip plain">Coba tempel ${r.rec.tempelDiblok}×</span>` : "", r.rec.otomatis ? `<span class="chip plain">Waktu habis</span>` : ""].filter(Boolean).join(" ") || `<span class="chip ok">Valid</span>`}</td>
          <td><button class="btn sm" data-grade="${esc(r.n)}">Nilai esai</button></td></tr>`).join("")}</tbody></table>`
        : `<div class="empty">Belum ada lembar jawaban. Muat berkas atau kode jawaban mahasiswa di atas.</div>`}</div>
      <p class="small muted">Nilai akhir = (bobot PG × nilai PG + bobot esai × nilai esai) ÷ total bobot, skala 0–100. Esai yang dikosongkan mahasiswa otomatis bernilai 0. Data rekap tersimpan di peramban ini saja, jadi ekspor CSV secara berkala.</p>
    </div>
    ${rows.length ? itemAnalysis(rows) : ""}
  </div>`;
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { const f = Array.from(e.dataTransfer.files || []); if (f.length) readFiles(f); });
  $("#fFiles").addEventListener("change", e => { const f = Array.from(e.target.files || []); if (f.length) readFiles(f); });
  $("#bPaste").onclick = () => {
    const t = $("#fPaste").value.trim(); if (!t) return toast("Tempelkan kode jawaban terlebih dahulu.");
    const chunks = t.startsWith("{") ? [t] : t.split(/\s+/).filter(x => x.startsWith("TLD1."));
    if (!chunks.length) return toast("Kode jawaban harus diawali TLD1.");
    importRecords(chunks.map(decodeRecordText));
  };
  ["wPG", "wE"].forEach(id => $("#" + id).addEventListener("change", e => { R[id] = Math.max(0, Math.min(100, Number(e.target.value) || 0)); saveRekap(); renderRekap(); }));
  $$("[data-grade]").forEach(b => b.onclick = () => openGrader(b.dataset.grade));
  if (rows.length) {
    $("#bCsv").onclick = () => saveFile(`rekap_nilai_${CONFIG.paket}.csv`, "﻿" + buildTable(";"), "text/csv");
    $("#bTsv").onclick = () => copyText(buildTable("\t", true));
    $("#bClearAll").onclick = () => openModal({
      title: "Hapus semua data rekap?",
      body: `<p>${rows.length} lembar jawaban dan semua nilai esai yang sudah Anda masukkan akan dihapus dari peramban ini. Ekspor CSV terlebih dahulu jika masih diperlukan.</p>`,
      actions: [{ label: "Batal" }, { label: "Hapus semua", cls: "danger solid", onClick: () => { R.records = {}; R.scores = {}; saveRekap(); renderRekap(); } }]
    });
  }
}
function buildTable(sep, noSepLine) {
  const head = ["No", "NIM", "Nama", "Kelas", "PG benar", "Nilai PG", ...Q.esai.map(e => "Skor " + e.id + " (maks " + e.maks + ")"), "Nilai esai", "Nilai akhir", "Status esai", "Pindah tab", "Coba tempel", "Verifikasi berkas", "Mulai", "Selesai"];
  const q = v => { const s = String(v == null ? "" : v); return (s.includes(sep) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [head.map(q).join(sep)];
  Object.keys(R.records).sort().forEach((n, i) => {
    const rec = R.records[n]; const f = finalScore(n); const sc = R.scores[n] || {};
    const es = Q.esai.map(e => { const a = sc[e.id]; if (a && a.some(v => v !== null && v !== "")) return fmtNum(a.reduce((x, v) => x + (Number(v) || 0), 0)); return (rec.esai[e.id] || "").trim() ? "" : "0"; });
    lines.push([i + 1, n, rec.nama, rec.kelas, f.pg.benar, fmtNum(f.pg.nilai), ...es, f.es.complete ? fmtNum(f.es.nilai) : "", f.es.complete ? fmtNum(f.akhir) : "", f.es.complete ? "lengkap" : f.es.graded + "/" + Q.esai.length, rec.pindahTab, rec.tempelDiblok || 0, rec._valid ? "valid" : "diubah", rec.mulai, rec.selesai].map(q).join(sep));
  });
  return (noSepLine ? "" : "sep=" + sep + "\r\n") + lines.join("\r\n");
}
function itemAnalysis(rows) {
  const n = rows.length;
  const data = Q.pg.map((q, i) => {
    const benar = rows.filter(r => r.rec.pg[q.id] === K.pg[q.id].kunci).length;
    const p = benar / n;
    return { i, q, benar, p, kat: p > 0.70 ? ["Mudah", "ok"] : p >= 0.30 ? ["Sedang", ""] : ["Sukar", "bad"] };
  });
  return `<div class="card pad stack" style="gap:12px">
    <div><h2>Analisis butir pilihan ganda</h2><p class="small muted">Indeks kesukaran p = proporsi mahasiswa yang menjawab benar (n = ${n}). Kategori: p &lt; 0,30 sukar · 0,30–0,70 sedang · p &gt; 0,70 mudah.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Butir</th><th>Topik</th><th>Level</th><th class="n">Benar</th><th class="n">p</th><th style="width:30%"></th><th>Kategori</th></tr></thead>
    <tbody>${data.map(d => `<tr><td class="mono">${esc(d.q.id)}</td><td>${esc(d.q.topik)}</td><td class="mono">${esc(d.q.level)}</td><td class="n">${d.benar}/${n}</td><td class="n">${fmtNum(d.p, 2)}</td><td><div class="bar"><i style="width:${(d.p * 100).toFixed(1)}%"></i></div></td><td><span class="chip ${d.kat[1]}">${d.kat[0]}</span></td></tr>`).join("")}</tbody></table></div>
  </div>`;
}

function openGrader(nim) {
  const nims = Object.keys(R.records).sort();
  const idx = nims.indexOf(nim);
  const rec = R.records[nim];
  R.scores[nim] = R.scores[nim] || {};
  const sc = R.scores[nim];
  const pg = pgScore(rec);
  const body = `<div class="grader">
    <p class="muted"><span class="mono">${esc(rec.nim)}</span> · ${esc(rec.kelas)} · PG benar <span class="mono">${pg.benar}/${Q.pg.length}</span> · Pindah tab <span class="mono">${rec.pindahTab}</span>×</p>
    ${Q.esai.map((e, j) => {
      const ans = (rec.esai[e.id] || "");
      const rub = K.esai[e.id].rubrik;
      const cur = sc[e.id] || [];
      return `<div class="gitem">
        <h3>Esai ${j + 1} <span class="muted small">(${esc(e.id)} · maks ${e.maks})</span></h3>
        <p>${esc(e.soal)}</p>
        <div><div class="small muted" style="margin-bottom:6px">Jawaban mahasiswa · ${words(ans)} kata</div>
        <div class="answerbox">${ans.trim() ? esc(ans) : `<i class="muted">Tidak dijawab (otomatis 0)</i>`}</div></div>
        <details><summary>Poin jawaban ideal</summary><ul>${K.esai[e.id].poin.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>
        <table class="rub"><thead><tr><th>Kriteria rubrik</th><th>Skor</th></tr></thead><tbody>
        ${rub.map((r, k) => `<tr><td>${esc(r.k)}</td><td><input type="number" class="rubin" data-e="${e.id}" data-k="${k}" min="0" max="${r.s}" step="0.5" value="${cur[k] == null ? "" : esc(cur[k])}" aria-label="${esc(r.k)}" ${ans.trim() ? "" : "disabled"}> <span class="muted small">/ ${r.s}</span></td></tr>`).join("")}
        <tr><td><b>Jumlah</b></td><td class="mono"><b id="sum_${e.id}">–</b> / ${e.maks}</td></tr></tbody></table>
      </div>`;
    }).join("")}</div>`;
  const acts = [];
  if (idx > 0) acts.push({ label: "‹ Sebelumnya", onClick: () => openGrader(nims[idx - 1]) });
  if (idx < nims.length - 1) acts.push({ label: "Berikutnya ›", onClick: () => openGrader(nims[idx + 1]) });
  acts.push({ label: "Selesai", cls: "primary", onClick: () => renderRekap() });
  const m = openModal({ title: rec.nama, body, actions: acts, wide: true, dismiss: false });
  const upd = eid => {
    const arr = sc[eid] || [];
    const has = arr.some(v => v !== null && v !== "");
    $("#sum_" + eid, m).textContent = has ? fmtNum(arr.reduce((a, v) => a + (Number(v) || 0), 0)) : ((rec.esai[eid] || "").trim() ? "–" : "0");
  };
  Q.esai.forEach(e => upd(e.id));
  $$(".rubin", m).forEach(inp => inp.addEventListener("change", () => {
    const eid = inp.dataset.e, k = +inp.dataset.k, max = Number(inp.max);
    let v = inp.value === "" ? null : Math.max(0, Math.min(max, Math.round(Number(inp.value) * 2) / 2));
    if (v !== null && isNaN(v)) v = null;
    inp.value = v == null ? "" : v;
    sc[eid] = sc[eid] || K.esai[eid].rubrik.map(() => null);
    sc[eid][k] = v;
    saveRekap(); upd(eid);
  }));
  const first = $(".rubin:not([disabled])", m); first && first.focus();
}

function renderKunci() {
  $("#dbody").innerHTML = `<div class="stack">
    <div class="note">Urutan di bawah adalah urutan asli bank soal. Mahasiswa melihat soal dan pilihan jawaban dalam urutan acak yang berbeda-beda; penilaian otomatis tetap memakai kunci asli ini.</div>
    <h2>Pilihan ganda (${Q.pg.length} butir)</h2>
    ${Q.pg.map(q => `<article class="card keyq">
      <div class="qhead"><span class="qno">${esc(q.id)}</span><span class="qtype">${esc(q.topik)} · ${esc(q.level)}</span></div>
      <p>${esc(q.soal)}</p>
      <ol>${q.opsi.map((o, i) => `<li class="${i === K.pg[q.id].kunci ? "right" : ""}">${esc(o)}${i === K.pg[q.id].kunci ? " ✓" : ""}</li>`).join("")}</ol>
      <p class="bahas">${esc(K.pg[q.id].bahas)}</p></article>`).join("")}
    <h2>Esai (${Q.esai.length} butir)</h2>
    ${Q.esai.map(e => `<article class="card keyq">
      <div class="qhead"><span class="qno">${esc(e.id)}</span><span class="qtype">${esc(e.topik)} · ${esc(e.level)} · maks ${e.maks}</span></div>
      <p>${esc(e.soal)}</p>
      <div><b class="small">Poin jawaban ideal</b><ul>${K.esai[e.id].poin.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
      <table class="rub"><thead><tr><th>Kriteria rubrik</th><th>Skor</th></tr></thead><tbody>${K.esai[e.id].rubrik.map(r => `<tr><td>${esc(r.k)}</td><td class="mono">${r.s}</td></tr>`).join("")}</tbody></table>
    </article>`).join("")}
  </div>`;
}
function renderInfo() {
  $("#dbody").innerHTML = `<div class="stack" style="max-width:820px">
    <div class="card pad stack" style="gap:14px">
      <h2>Paket ujian</h2>
      <dl class="dl">
        <dt>Mata kuliah</dt><dd>${esc(CONFIG.mk)}</dd>
        <dt>Jenis ujian</dt><dd>${esc(CONFIG.judul)}</dd>
        <dt>Kode paket</dt><dd class="mono">${esc(CONFIG.paket)}</dd>
        <dt>Token ujian</dt><dd><span class="mono" style="font-size:20px">${esc(K.token)}</span> <span class="small muted">· umumkan saat ujian dimulai</span></dd>
        <dt>Durasi</dt><dd>${CONFIG.durasiMenit} menit</dd>
        <dt>Soal</dt><dd>${Q.pg.length} pilihan ganda (masing-masing 1 poin) dan ${Q.esai.length} esai (masing-masing maks 20)</dd>
        <dt>Bobot bawaan</dt><dd>PG ${CONFIG.bobotPG}% · esai ${CONFIG.bobotEsai}%</dd>
      </dl>
    </div>
    <div class="card pad stack" style="gap:12px">
      <h2>Alur pelaksanaan</h2>
      <ol class="steps">
        <li>Bagikan tautan halaman ini (atau berkas HTML-nya) kepada mahasiswa sebelum ujian.</li>
        <li>Saat ujian dimulai, umumkan token. Tanpa token, soal tidak dapat dibuka.</li>
        <li>Mahasiswa mengunduh lembar jawaban (.json) atau menyalin kode jawaban, lalu mengirimkannya melalui saluran yang Anda tentukan.</li>
        <li>Di tab <b>Rekap nilai</b>, muat semua berkas, nilai esai dengan rubrik, lalu ekspor CSV.</li>
      </ol>
    </div>
    <div class="card pad stack" style="gap:12px">
      <h2>Batas pengamanan</h2>
      <ul class="steps">
        <li>Soal dan kunci tersimpan tersandi di dalam halaman. Soal hanya terbuka dengan token, kunci dan rubrik hanya dengan PIN dosen. Penyandian ini mencegah intip sekilas, bukan pengamanan setara server.</li>
        <li>Pindah tab, percobaan menempel teks, dan waktu mulai–selesai dicatat. Aplikasi tidak dapat mencegah mahasiswa memakai perangkat kedua, jadi pengawasan tetap diperlukan.</li>
        <li>Kode verifikasi di setiap berkas menandai berkas yang isinya diubah setelah ujian.</li>
        <li>Data rekap hanya tersimpan di peramban ini. Ekspor CSV setelah selesai menilai.</li>
      </ul>
    </div>
  </div>`;
}

route();
</script>
